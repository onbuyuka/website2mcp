name: site2mcp publish
description: Index a built website and publish .well-known/site2mcp.json alongside it, so AI assistants can use the site through MCP.
branding:
  icon: search
  color: blue

inputs:
  directory:
    description: Build output folder to index (for example dist, build, or _site).
    required: true
  base-url:
    description: Public URL the folder is deployed to, for example https://example.com/docs/.
    required: true
  render:
    description: '"auto" (default), "true" to always render with a headless browser, or "false" to index static HTML only.'
    required: false
    default: auto
  max-pages:
    description: Maximum number of pages to index.
    required: false
    default: "5000"
  version:
    description: site2mcp version to run.
    required: false
    default: latest

outputs:
  index-file:
    description: Path of the written index.
    value: ${{ steps.publish.outputs.index-file }}

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: 22
    - id: publish
      shell: bash
      env:
        SITE2MCP_DIR: ${{ inputs.directory }}
        SITE2MCP_BASE_URL: ${{ inputs.base-url }}
        SITE2MCP_RENDER: ${{ inputs.render }}
        SITE2MCP_MAX_PAGES: ${{ inputs.max-pages }}
        SITE2MCP_VERSION: ${{ inputs.version }}
      run: |
        args=(build "$SITE2MCP_DIR" --base-url "$SITE2MCP_BASE_URL" --publish --max-pages "$SITE2MCP_MAX_PAGES")
        case "$SITE2MCP_RENDER" in
          true) args+=(--render) ;;
          false) args+=(--no-render) ;;
        esac
        npx --yes "site2mcp@$SITE2MCP_VERSION" "${args[@]}"
        echo "index-file=$SITE2MCP_DIR/.well-known/site2mcp.json" >> "$GITHUB_OUTPUT"
